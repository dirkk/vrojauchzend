<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ .Site.Params.description }}">
    <title>{{ .Site.Title }}</title>
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
    <header>
        <div class="container">
            <div class="hero-image">
                <img src="{{ "images/IMG_2947.jpg" | relURL }}" alt="VroJAuchzenD Header">
            </div>
            <h1>{{ .Site.Title }}</h1>
        </div>
    </header>

    <main class="container">
        {{ .Content }}

        <section class="gallery">
            <div class="gallery-grid">
                <img src="{{ "images/Blick-zum-ueberdachten-Sitz.jpg" | relURL }}" alt="Überdachter Sitzbereich">
                <img src="{{ "images/Teich-mit-Springbrunnen.jpg" | relURL }}" alt="Teich mit Springbrunnen">
                <img src="{{ "images/Grillstelle.jpg" | relURL }}" alt="Grillstelle">
                <img src="{{ "images/Teich.jpg" | relURL }}" alt="Teich">
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024-2025 VroJAuchzenD | <a href="mailto:{{ .Site.Params.email }}">{{ .Site.Params.email }}</a></p>
        </div>
    </footer>
</body>
</html>
